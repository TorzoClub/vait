name: Pull Request Check

on:
  pull_request:
    branches:
      - master
      - dev

jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Copy Repo Files
      uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install modules
      run: npm ci
    - name: Test
      run: npm test

  CodeCheck:
    name: CodeCheck
    runs-on: ubuntu-latest

    steps:
    - name: Copy Repo Files
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install modules
      run: npm ci
    - name: ESLint
      run: npm run lint-strict
    - name: TSC
      run: npm run runtsc
